<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="990" viewBox="0 0 1660 990">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD34D"/>
      <stop offset="0.45" stop-color="#F2A900"/>
      <stop offset="1" stop-color="#B97800"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B97800"/>
      <stop offset="1" stop-color="#7A4E00"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63B3FF"/>
      <stop offset="0.55" stop-color="#1E88E5"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <rect width="1660" height="990" fill="#000000"/>

  <!-- kente-inspired pattern column -->
  <g opacity="0.9">
    <rect x="30" y="330" width="46" height="230" fill="url(#goldDark)"/>
    <g fill="#F2A900">
      <rect x="38" y="342" width="30" height="16"/><rect x="38" y="374" width="12" height="16"/><rect x="56" y="374" width="12" height="16"/>
      <rect x="38" y="406" width="30" height="16"/><rect x="38" y="438" width="12" height="16"/><rect x="56" y="438" width="12" height="16"/>
      <rect x="38" y="470" width="30" height="16"/><rect x="38" y="502" width="12" height="16"/><rect x="56" y="502" width="12" height="16"/>
    </g>
  </g>

  <!-- big G with community trio + chat bubble -->
  <g>
    <path d="M 420 305 a 195 195 0 1 0 0 390 h 95 v -95 h -95 a 100 100 0 1 1 0 -200 h 105 v -95 z" fill="url(#gold)"/>
    <!-- community trio -->
    <circle cx="415" cy="395" r="26" fill="#FFC93C"/>
    <path d="M 373 470 a 42 34 0 0 1 84 0 z" fill="#FFC93C"/>
    <circle cx="366" cy="412" r="22" fill="#2B2B2B"/>
    <path d="M 330 478 a 38 30 0 0 1 74 0 z" fill="#2B2B2B"/>
    <circle cx="466" cy="412" r="22" fill="#2B2B2B"/>
    <path d="M 430 478 a 38 30 0 0 1 74 0 z" fill="#2B2B2B"/>
    <!-- chat bubble -->
    <rect x="380" y="470" width="110" height="66" rx="18" fill="#0B0B0D" stroke="#F2A900" stroke-width="6"/>
    <path d="M 420 536 l 16 22 l 14 -22 z" fill="#0B0B0D" stroke="#F2A900" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="412" cy="503" r="8" fill="#F2A900"/>
    <circle cx="438" cy="503" r="8" fill="#F2A900"/>
    <circle cx="464" cy="503" r="8" fill="#F2A900"/>
  </g>

  <!-- A -->
  <g fill="url(#gold)">
    <path d="M 560 700 L 655 300 L 745 300 L 840 700 L 748 700 L 731 615 L 669 615 L 652 700 Z M 685 540 L 700 455 L 715 540 Z"/>
  </g>
  <!-- D -->
  <g fill="url(#gold)">
    <path d="M 880 300 h 105 a 200 200 0 0 1 0 400 h -105 z M 972 385 v 230 a 115 115 0 0 0 0 -230 z"/>
  </g>
  <!-- A (second) -->
  <g fill="url(#gold)">
    <path d="M 1128 700 L 1223 300 L 1313 300 L 1408 700 L 1316 700 L 1299 615 L 1237 615 L 1220 700 Z M 1253 540 L 1268 455 L 1283 540 Z"/>
  </g>
  <!-- VIRAL -->
  <g>
    <path d="M 1005 700 L 1063 300 h 88 l -58 400 z" fill="none"/>
  </g>
  <text x="1445" y="700" font-family="Arial Black, Arial, sans-serif" font-size="380" font-weight="900"
        fill="#0B0B0D" stroke="url(#gold)" stroke-width="10" text-anchor="middle">L</text>
  <text x="1005" y="700" font-family="Arial Black, Arial, sans-serif" font-size="380" font-weight="900"
        fill="url(#gold)" text-anchor="middle">V</text>
  <text x="1150" y="700" font-family="Arial Black, Arial, sans-serif" font-size="380" font-weight="900"
        fill="#0B0B0D" stroke="url(#gold)" stroke-width="8" text-anchor="middle">I</text>
  <text x="1290" y="700" font-family="Arial Black, Arial, sans-serif" font-size="380" font-weight="900"
        fill="#0B0B0D" stroke="url(#gold)" stroke-width="8" text-anchor="middle">R</text>
  <text x="1445" y="700" font-family="Arial Black, Arial, sans-serif" font-size="380" font-weight="900"
        fill="#0B0B0D" stroke="url(#gold)" stroke-width="8" text-anchor="middle">A</text>

  <!-- blue wave swoosh -->
  <path d="M 40 640 C 220 520 420 700 620 600 C 760 535 900 585 1040 560 L 1040 640 C 900 660 760 615 620 680 C 430 765 220 585 40 705 Z"
        fill="url(#wave)"/>
  <path d="M 40 700 C 220 585 430 765 620 680 C 760 615 900 660 1040 640 L 1040 675 C 900 695 760 650 620 715 C 430 800 220 620 40 735 Z"
        fill="url(#wave)" opacity="0.65"/>

  <!-- tagline pill -->
  <rect x="330" y="760" width="1000" height="92" rx="46" fill="#050505" stroke="url(#gold)" stroke-width="6"/>
  <rect x="368" y="800" width="90" height="10" rx="5" fill="#F2A900"/>
  <rect x="1202" y="800" width="90" height="10" rx="5" fill="#F2A900"/>
  <text x="830" y="822" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">Dangme &amp; Ga Online Social Community</text>
</svg>
