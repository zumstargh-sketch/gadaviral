<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0B0D" />
  <meta name="description" content="GADAVIRAL — Dangme & Ga Online Social Community. Connect, share, build together." />
  <title>GADAVIRAL — Dangme & Ga Online Social Community</title>
  <link rel="canonical" href="https://www.gadaviral.com/app/" />
  <link rel="icon" href="/app/icons/favicon-32.png" />
  <!--
    GADAVIRAL homepage redirect (FALLBACK method — only if .htaccess cannot
    be edited; see deploy/root-htaccess-addition.txt for the recommended way).

    Upload this file as:  /public_html/index.html  (create it — the root has
    WordPress's index.php, which renders the blank page). ALSO add this one
    line at the TOP of /public_html/.htaccess so this file is served instead
    of index.php:
        DirectoryIndex index.html index.php
    It instantly sends visitors to the app at /app/.
  -->
  <script>try { location.replace('/app/'); } catch (e) { location.href = '/app/'; }</script>
  <meta http-equiv="refresh" content="0; url=/app/" />
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0D; color: #F2A900;
      font-family: system-ui, 'Segoe UI', sans-serif; display: flex;
      align-items: center; justify-content: center; }
    a { color: #F2A900; }
  </style>
</head>
<body>
  <noscript><a href="/app/">Open GADAVIRAL</a></noscript>
  Opening GADAVIRAL…
</body>
</html>
