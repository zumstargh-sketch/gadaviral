<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0B0D" />
  <meta name="description" content="GADAVIRAL — Dangme & Ga Online Social Community. Connect, share, build together." />
  <link rel="icon" href="/app/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/app/icons/icon-180.png" />
  <title>GADAVIRAL — Dangme & Ga Online Social Community</title>
  <script type="module" crossorigin src="/app/assets/index-DzAqrZcf.js"></script>
  <link rel="stylesheet" crossorigin href="/app/assets/index-DV0GVn9t.css">
</head>
<body>
  <div id="splash">
    <img class="splash-mark" src="/app/icons/icon-512.png" alt="GADAVIRAL logo" />
    <div class="splash-logo">GADA<span>VIRAL</span></div>
    <div class="splash-tag">Dangme &amp; Ga Online Social Community</div>
    <div class="splash-people" id="splash-people"></div>
    <div class="splash-people-cap" id="splash-people-cap"></div>
    <div class="splash-made">Made by <b>DATILA Solutions</b></div>
  </div>
  <div id="root"></div>
  <script>
    // Show real seeded-member profile pictures on the startup splash (decorative:
    // silently skipped when the API is slow or unreachable — avatars are cached).
    // Same origin as the WordPress API: https://www.gadaviral.com/wp-json/gadaviral/v1
    (function () {
      try {
        var ctl = new AbortController();
        var timer = setTimeout(function () { ctl.abort(); }, 1800);
        var API_BASE = window.__GADV_API_BASE__ || '/wp-json/gadaviral/v1';
        fetch(API_BASE + '/community/highlights', { signal: ctl.signal })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            clearTimeout(timer);
            var host = document.getElementById('splash-people');
            if (!d || !host || !d.items || !d.items.length) return;
            d.items.slice(0, 8).forEach(function (u) {
              var img = document.createElement('img');
              img.src = u.avatar_url;
              img.alt = u.full_name || 'GADAVIRAL member';
              host.appendChild(img);
            });
            var cap = document.getElementById('splash-people-cap');
            if (cap) cap.textContent = d.total + ' members already sharing — join them';
          })
          .catch(function () { clearTimeout(timer); });
      } catch (e) { /* splash avatars are decorative */ }
    })();
  </script>
</body>
</html>
