openapi: 3.0.3
info:
  title: GADAVIRAL API
  description: |
    Ga & Dangme online social community API. One backend for Website, Android and Windows.
    Auth: JWT bearer access tokens (15 min) + rotating refresh tokens (30 days).
    Google sign-in uses genuine OpenID Connect ID tokens verified against Google JWKS.
    Authentication emails are sent from GADAVIRAL <admin@gadaviral.com>.
    Full endpoint reference: docs/API.md
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get: { tags: [Auth], summary: Health + database check, responses: { '200': { description: OK } } }
  /auth/register:
    post: { tags: [Auth], summary: 'Register (email+password) → verification link + OTP email', responses: { '202': { description: Sent }, '400': { description: Invalid } } }
  /auth/verify-email:
    get: { tags: [Auth], summary: 'Verify via single-use link (?token=)', responses: { '200': { description: OK }, '410': { description: Expired/used } } }
  /auth/verify-otp:
    post: { tags: [Auth], summary: 'Verify via 6-digit OTP {email,otp}', responses: { '200': { description: OK } } }
  /auth/resend-verification:
    post: { tags: [Auth], summary: Resend (cooldown + rate-limited), responses: { '200': { description: OK } } }
  /auth/login:
    post: { tags: [Auth], summary: 'Login → access+refresh tokens', responses: { '200': { description: OK }, '401': { description: Bad credentials } } }
  /auth/refresh:
    post: { tags: [Auth], summary: Rotate refresh token, responses: { '200': { description: OK } } }
  /auth/logout:
    post: { tags: [Auth], summary: Revoke session, responses: { '200': { description: OK } } }
  /auth/forgot-password:
    post: { tags: [Auth], summary: Request reset email (anti-enumeration), responses: { '200': { description: OK } } }
  /auth/reset-password:
    post: { tags: [Auth], summary: Reset with single-use token, responses: { '200': { description: OK } } }
  /auth/change-password:
    post: { tags: [Auth], summary: Change password (revokes sessions), security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /auth/change-email:
    post: { tags: [Auth], summary: Request email change, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /auth/google/url:
    get: { tags: [Auth], summary: Google authorization URL (signed state), responses: { '200': { description: OK } } }
  /auth/google/callback:
    get: { tags: [Auth], summary: OAuth callback → link/create account, responses: { '302': { description: Redirect } } }
  /auth/google/idtoken:
    post: { tags: [Auth], summary: 'Android/Windows ID-token sign-in (verified via Google JWKS)', responses: { '200': { description: Session + isNewUser/linked flags } } }
  /auth/me:
    get: { tags: [Auth], summary: Current user + profile, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /posts:
    get: { tags: [Posts], summary: 'Feed (recent|following|recommended), paginated', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
    post: { tags: [Posts], summary: Create post (verified email; moderated), security: [{ bearerAuth: [] }], responses: { '201': { description: OK }, '403': { description: EMAIL_NOT_VERIFIED } } }
  /posts/media:
    post: { tags: [Posts], summary: 'Create media post (multipart, ≤6 files)', security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  '/posts/{id}':
    get: { tags: [Posts], summary: Post detail (records view), parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
    patch: { tags: [Posts], summary: Edit own post, security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
    delete: { tags: [Posts], summary: Delete/remove post, security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
  '/posts/{id}/react':
    put: { tags: [Posts], summary: React (unique per user+post), security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
    delete: { tags: [Posts], summary: Remove reaction, security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
  '/posts/{id}/comments':
    get: { tags: [Posts], summary: Comments list, parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '200': { description: OK } } }
    post: { tags: [Posts], summary: 'Comment / reply (parentCommentId)', security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '201': { description: OK } } }
  '/posts/{id}/share':
    post: { tags: [Posts], summary: Share (real row; unique per target), security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '201': { description: OK } } }
  '/posts/{id}/vote':
    post: { tags: [Posts], summary: Poll vote, security: [{ bearerAuth: [] }], parameters: [{ '$ref': '#/components/parameters/Id' }], responses: { '201': { description: OK } } }
  '/users/{username}':
    get: { tags: [Users], summary: Public profile, parameters: [{ name: username, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  '/users/{username}/follow':
    post: { tags: [Users], summary: Follow, security: [{ bearerAuth: [] }], parameters: [{ name: username, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
    delete: { tags: [Users], summary: Unfollow, security: [{ bearerAuth: [] }], parameters: [{ name: username, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  '/users/{username}/block':
    post: { tags: [Users], summary: 'Block (+remove mutual follows)', security: [{ bearerAuth: [] }], parameters: [{ name: username, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /users/me/avatar:
    post: { tags: [Users], summary: Upload avatar (multipart), security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /groups:
    get: { tags: [Community], summary: List/search groups, responses: { '200': { description: OK } } }
    post: { tags: [Community], summary: Create group, security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  /events:
    get: { tags: [Community], summary: Upcoming events, responses: { '200': { description: OK } } }
    post: { tags: [Community], summary: Create event, security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  '/events/{slug}/rsvp':
    post: { tags: [Community], summary: RSVP, security: [{ bearerAuth: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /businesses:
    get: { tags: [Community], summary: Business directory, responses: { '200': { description: OK } } }
    post: { tags: [Community], summary: Add listing, security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  /messages/conversations:
    get: { tags: [Messaging], summary: Inbox, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
    post: { tags: [Messaging], summary: Start 1:1 conversation, security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  '/messages/conversations/{id}':
    get: { tags: [Messaging], summary: History (marks read), security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
    post: { tags: [Messaging], summary: Send message (realtime), security: [{ bearerAuth: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '201': { description: OK } } }
  /search:
    get: { tags: [Community], summary: Global search, parameters: [{ name: q, in: query, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /reports:
    post: { tags: [Safety], summary: Report any entity, security: [{ bearerAuth: [] }], responses: { '201': { description: OK } } }
  /moderation/queue:
    get: { tags: [Safety], summary: 'Reports + flagged content (moderator+)', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/users:
    get: { tags: [Admin], summary: 'User management (admin+)', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/analytics:
    get: { tags: [Admin], summary: 'Analytics (admin+)', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/demo/stats:
    get: { tags: [Admin], summary: 'Demo analytics (§87)', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/demo/verify:
    get: { tags: [Admin], summary: 'Validate all demo rules (§98)', security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/demo/seed:
    post: { tags: [Admin], summary: REGENERATE DEMO DATA, security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
  /admin/demo/wipe:
    post: { tags: [Admin], summary: DELETE ALL DEMO DATA (real data untouched), security: [{ bearerAuth: [] }], responses: { '200': { description: OK } } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
